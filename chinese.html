<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chinese Prep | Sydney Mandarin and English Social Club</title>
    <meta
      name="description"
      content="Prepare your Chinese practice lines before the meetup. Choose your level, select sentences, fill in your details, and save your stack locally."
    />
    <meta name="theme-color" content="#f36a2d" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-prep-mode="mandarin">
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-mesh"></div>

    <div class="site-wrap">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="Return to homepage">
          <span class="brand-mark">ME</span>
          <span class="brand-copy">
            <strong>Sydney Mandarin and English Social Club</strong>
            <span>Chinese preparation page</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="chinese.html">Chinese</a>
          <a href="english.html">English</a>
        </nav>
      </header>

      <main>
        <section class="section prep-header reveal">
          <div class="prep-header-bar">
            <div>
              <p class="eyebrow">Chinese prep</p>
              <h1 class="prep-title">Prepare your Chinese lines.</h1>
              <p class="prep-note">For English speakers practising Chinese.</p>
            </div>
          </div>
        </section>

        <section class="section reveal" id="prep-app">
          <div class="prep-layout">
            <section class="prep-main">
              <div class="prep-toolbar">
                <label class="speed-control" for="speechRateInput">
                  <span>Speed</span>
                  <input id="speechRateInput" type="range" min="0.5" max="1.15" step="0.05" value="0.75" />
                  <strong id="speechRateValue">0.75x</strong>
                </label>
                <div class="prep-toolbar-actions">
                  <button class="mini-button" id="restoreHiddenButton" type="button">Restore hidden</button>
                </div>
              </div>
              <div id="levelSections"></div>
            </section>

            <aside class="prep-sidebar">
              <div class="builder-card output-card">
                <div class="builder-card-head">
                  <h3>Selected</h3>
                </div>

                <div class="output-actions">
                  <button class="button button-primary output-button output-button-main" id="presentationModeButton" type="button">Presentation</button>
                  <div class="output-utility-actions" aria-label="Utilities">
                    <button class="utility-button" id="copyPracticeButton" type="button" aria-label="Copy practice stack" title="Copy practice stack">⎘</button>
                    <button class="utility-button" id="copyBilingualButton" type="button" aria-label="Copy bilingual stack" title="Copy bilingual stack">文</button>
                    <button class="utility-button" id="clearSelectionsButton" type="button" aria-label="Clear selections" title="Clear selections">×</button>
                  </div>
                </div>

                <div class="selected-stack" id="selectedStack"></div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="sentence-prep.js"></script>
  </body>
</html>
