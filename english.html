<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Prep | Sydney Mandarin and English Social Club</title>
    <meta
      name="description"
      content="Prepare your English practice script before the meetup. Choose your level, select sentences, fill in your details, and save your stack locally."
    />
    <meta name="theme-color" content="#f36a2d" id="themeColorMeta" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("mesc-theme");
        const savedFontScale = Number(localStorage.getItem("mesc-font-scale"));
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.setProperty("--font-scale", String(Number.isFinite(savedFontScale) ? savedFontScale : 1));
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-prep-mode="english">
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-mesh"></div>

    <div class="site-wrap">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="Return to homepage">
          <span class="brand-title">Chinese-English</span>
        </a>

        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="siteHeaderPanel" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="site-header-actions" id="siteHeaderPanel" data-nav-panel>
          <nav class="site-nav" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="chinese.html">Chinese</a>
            <a href="english.html">English</a>
          </nav>
          <div class="site-preferences" aria-label="Display settings">
            <button class="preference-button" type="button" data-font-size="decrease" aria-label="Decrease font size">A−</button>
            <button class="preference-button" type="button" data-font-size="reset" aria-label="Reset font size">A</button>
            <button class="preference-button" type="button" data-font-size="increase" aria-label="Increase font size">A+</button>
            <button class="theme-toggle preference-button" type="button" data-theme-toggle aria-label="Toggle colour theme">Theme</button>
          </div>
        </div>
      </header>

      <main>
        <section class="section prep-header reveal">
          <div class="prep-header-bar">
            <div>
              <p class="eyebrow">English prep</p>
              <h1 class="prep-title">Prepare your English lines.</h1>
              <p class="prep-note">For Chinese speakers practising English. Pick your lines, fill in your details, tap a sentence to hear it, then use Full screen at the meetup.</p>
            </div>
          </div>
        </section>

        <section class="section reveal" id="prep-app">
          <div class="prep-layout">
            <section class="prep-main">
              <div class="builder-card prep-session-card">
                <div class="prep-session-head">
                  <div>
                    <h2>This meetup</h2>
                    <p>Your current practice set.</p>
                  </div>
                  <button class="mini-button" id="newSessionButton" type="button">New meetup</button>
                </div>
                <div class="prep-session-fields">
                  <label class="field">
                    <span>Session name</span>
                    <input id="sessionTitleInput" type="text" placeholder="Wed 6 May Meetup" />
                  </label>
                  <label class="field">
                    <span>Date</span>
                    <input id="sessionDateInput" type="date" />
                  </label>
                </div>
              </div>

              <div class="prep-toolbar">
                <label class="speed-control" for="speechRateInput">
                  <span>Speech speed <small>for audio</small></span>
                  <input id="speechRateInput" type="range" min="0.5" max="1.15" step="0.05" value="0.75" />
                  <strong id="speechRateValue">Slower</strong>
                </label>
                <div class="prep-toolbar-actions">
                  <button class="mini-button" id="restoreHiddenButton" type="button">Show hidden</button>
                </div>
              </div>
              <div id="levelSections"></div>
            </section>

            <aside class="prep-sidebar">
              <div class="builder-card output-card">
                <div class="builder-card-head">
                  <h3>Your lines</h3>
                </div>

                <div class="output-actions">
                  <button class="button button-primary output-button output-button-main" id="presentationModeButton" type="button">Full screen</button>
                  <div class="output-utility-actions" aria-label="Utilities">
                    <button class="utility-button" id="copyPracticeButton" type="button" aria-label="Copy practice stack" title="Copy practice stack">⎘</button>
                    <button class="utility-button" id="copyBilingualButton" type="button" aria-label="Copy bilingual stack" title="Copy bilingual stack">文</button>
                    <button class="utility-button" id="clearSelectionsButton" type="button" aria-label="Clear selections" title="Clear selections">×</button>
                  </div>
                </div>

                <div class="selected-stack" id="selectedStack"></div>
              </div>

              <div class="builder-card archive-card">
                <div class="builder-card-head">
                  <h3>Earlier meetups</h3>
                </div>
                <div class="archived-sessions" id="archivedSessions"></div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script src="theme.js"></script>
    <script type="module" src="sentence-prep.js"></script>
  </body>
</html>
